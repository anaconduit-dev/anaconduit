name: Build & Push Docker Image

on:
  push:
    tags:
      - 'v*'     # запуск по git-тегам
  workflow_dispatch:  # возможность ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract version from TAG
        id: vars
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ secrets.GHCR_USER }}/anaconduit:${{ steps.vars.outputs.VERSION }} \
            -t ghcr.io/${{ secrets.GHCR_USER }}/anaconduit:latest \
            .

      - name: Push image
        run: |
          docker push ghcr.io/${{ secrets.GHCR_USER }}/anaconduit:${{ steps.vars.outputs.VERSION }}
          docker push ghcr.io/${{ secrets.GHCR_USER }}/anaconduit:latest